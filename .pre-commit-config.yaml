repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        exclude: ^data/
      - id: end-of-file-fixer
        exclude: ^data/
      - id: trailing-whitespace
        exclude: ^data/
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
  - repo: local
    hooks:
      - id: lint_backend
        name: Lint Backend
        entry: ./scripts/pre-commits/lint_backend.sh
        language: system
        pass_filenames: false
        files: ^backend/

      - id: lint_frontend
        name: Lint Frontend
        entry: ./scripts/pre-commits/lint_frontend.sh
        language: system
        pass_filenames: false
        files: ^frontend/
