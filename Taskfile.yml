version: '3'

vars:
  CONFIG: '{{default "./config.cue" .CONFIG}}'
  SEC_CONFIG: '{{default "./config.dev.env" .SEC_CONFIG}}'
  COMPOSE_FILE: "/home/yahal/Repos/Leams/compose.letsencrypt.yaml:/home/yahal/Repos/Leams/compose.yaml"
  ANSIBLE_CONFIG: "/home/yahal/Repos/Leams/ansible.cfg"
  ANSIBLE_FOLDER: "/home/yahal/Repos/Leams/infra/ansible"
  SERVICE_ENVS:
    sh: find . -type f -name "*.tmpl*" ! -path "*node_modules*" ! -path "*.venv*" ! -path "*local*" ! -path "*nginx.conf*" ! -path "*nginx.ssl*"

tasks:
  proj_path:
    desc: Обновляет PROJ_DIR в конфигурационном файле
    
    cmds:
      - |
        path_in=$(grep 'PROJ_DIR' {{.CONFIG}} | sed -e 's/\//\\\//g')
        path_now=$(pwd | sed -e 's/\//\\\//g')
        sed -i "s/$path_in/PROJ_DIR=$path_now/" {{.CONFIG}}
        echo 'export SOME_ENV=someTest'

  nginx_cl:
    desc: Обновляет Cloudflare IPs в конфигурации Nginx
    cmds:
      - |
        set -a; . {{.CONFIG}}; set +a # Загружаем env, чтобы был доступен $PROJ_DIR
        first=$(grep "set_real_ip_from" $PROJ_DIR/./infra/nginx/deploy/nginx.conf.template | \
          sed -e 's/^[[:space:]]*//' \
          -e "s/set_real_ip_from //" \
          -e 's/\//\\\//g')
        second=$(curl -s https://www.cloudflare.com/ips-v6 https://www.cloudflare.com/ips-v4 | \
          sed -e 's/\//\\\//g' | \
          tr '\n' ' ')
        sed -i "s/$first/$second;/" ./infra/nginx/deploy/nginx.conf.template

  openssl:
    desc: Создает самоподписанный сертификат для dev-окружения
    deps: [proj_path]
    preconditions:
      - sh: command -v openssl
        msg: "openssl not found. Please download it."
    cmds:
      - |
        set -a; . {{.CONFIG}}; set +a
        openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
          -keyout $PROJ_DIR/infra/nginx/local/nginx-selfsigned.key \
          -out $PROJ_DIR/infra/nginx/local/nginx-selfsigned.crt

  replace:
    desc: Заменяет шаблоны файлов их сгенерированными версиями
    deps: [proj_path]
    preconditions:
      - sh: command -v gomplate
        msg: "gomplate not found. Please download it."
      - sh: command -v cue
        msg: "cue not found. Please download it."
    cmds:
      - |
        for file in {{.SERVICE_ENVS}}; do
          dest=$(echo $file | sed 's/\.tmpl//')
          cue export {{.CONFIG}} --out yaml | gomplate -d "config=stdin:///?type=application/yaml" -f $file -o $dest
        done

  encrypt:
    desc: Создает официальный сертификат letsencrypt (production)
    deps: [replace]
    preconditions:
      - sh: command -v docker
        msg: "docker not found. Please download it."
    cmds:
      - docker compose -f compose.letsencrypt.yaml --env-file {{.CONFIG}} up --force-recreate --build --abort-on-container-exit

  pre_ansible:
    desc: Экспорт конфига и запуск pre_ansible
    deps: [replace]
    cmds:
      - cue export {{.CONFIG}} --out yaml > ./config.yaml
      - docker compose up pre_ansible --force-recreate

  launch:
    desc: Запускает проект локально
    deps: [replace]
    preconditions:
      - sh: command -v docker
        msg: "docker not found."
    cmds:
      - docker compose --env-file {{.CONFIG}} up --force-recreate --build

  back_check:
    desc: Запуск Ruff проверки бекенда
    preconditions:
      - sh: command -v docker
        msg: "docker not found."
    cmds:
      - |
        set -a; . {{.CONFIG}}; set +a
        docker compose run --build $COMPOSE_BACKEND_NAME uv run ruff check .

  front_check:
    desc: Запуск проверок фронтенда (Bun/Biome)
    deps: [proj_path]
    preconditions:
      - sh: command -v docker
        msg: "docker not found."
    cmds:
      - |
        set -a; . {{.CONFIG}}; set +a
        docker run --rm \
          -v $PROJ_DIR/frontend:/app \
          -w /app \
          oven/bun:alpine \
          sh -c "bun install && bunx --bun @biomejs/biome check ./src/"

  deploy:
    desc: Полный цикл развертывания (nginx_cl -> encrypt -> launch)
    cmds:
      - task: nginx_cl
      - task: encrypt
      - task: launch

  all_check:
    desc: Запускает проверки и фронта, и бэка (ПАРАЛЛЕЛЬНО)
    deps: [back_check, front_check]

