- name: Install dependencies
  ansible.builtin.apt:
    name:
      - git
      - gettext
      - ca-certificates
      - curl
      - ufw
      - fail2ban
      - flarectl
    state: present

- name: Install uv (dependency)
  ansible.builtin.shell: curl -LsSf https://astral.sh/uv/install.sh | sh

- name: Install bun (dependency)
  ansible.builtin.shell: curl -fsSL https://bun.com/install | bash

# Docker installation (dependency)
- name: Ensure /etc/apt/keyrings exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Docker GPG key
  get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Add Docker apt repository
  copy:
    dest: /etc/apt/sources.list.d/docker.sources
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/debian
      Suites: {{ ansible_lsb.codename }}
      Components: stable
      Signed-By: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Update apt cache after adding Docker repo
  apt:
    update_cache: yes

- name: Install Docker packages
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

